name: Build desktop releases

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: Windows
            binary: classic-studio.exe
            package: classic-studio-windows-x86_64.exe
            cargo_args: ""
          - runner: ubuntu-latest
            label: Linux
            binary: classic-studio
            package: classic-studio-linux-x86_64
            # rfd disables its default Linux backend in Cargo.toml. The portal
            # backend is desktop-environment independent and needs no GTK SDK.
            cargo_args: --features rfd/xdg-portal
          - runner: macos-latest
            label: macOS
            binary: classic-studio
            package: classic-studio-macos
            cargo_args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build optimized desktop application
        shell: bash
        run: cargo build --release --locked ${{ matrix.cargo_args }}
      - name: Package binary
        shell: bash
        run: |
          mkdir -p release
          cp "target/release/${{ matrix.binary }}" "release/${{ matrix.package }}"
          if [[ "${{ matrix.binary }}" != *.exe ]]; then
            chmod +x "release/${{ matrix.package }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: classic-studio-${{ matrix.label }}
          path: release/*
      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
