[package]
name = "classic-guides"
version = "0.1.0"
edition = "2024"
description = "Serializable ruler guides and canvas snapping primitives for Classic Studio"
license = "MIT"

[lib]
name = "classic_guides"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
