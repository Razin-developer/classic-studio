[package]
name = "classic-assets"
version = "0.1.0"
edition = "2024"
description = "Local, serializable asset catalog models for Classic Studio"
license = "MIT"

[lib]
name = "classic_assets"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
