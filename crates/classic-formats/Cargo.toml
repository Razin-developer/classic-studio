[package]
name = "classic-formats"
version = "0.1.0"
edition = "2021"
description = "Versioned Classic interchange formats and basic SVG conversion"
license = "MIT"

[dependencies]
classic-core = { path = "../classic-core" }
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

