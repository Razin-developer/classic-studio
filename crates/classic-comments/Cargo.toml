[package]
name = "classic-comments"
version = "0.1.0"
edition = "2024"
description = "Local review-thread and comment domain models for Classic Studio"
license = "MIT"

[lib]
name = "classic_comments"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
